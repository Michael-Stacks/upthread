<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Upthread</title>
</head>
<body>

    <header>
        <h1><a href="./index.html">Upthread</a></h1>
        <a href="./login.html">Log in</a>
        <a href="./signup.html">Sign up</a>
    </header>

    <main>
        <h2>Log In</h2>

        <form action="#" method="post">

            <div>
                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required>
            </div>

            <br>

            <div>
                <label for="password">Password:</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required>
            </div>

            <br>

            <button type="submit">Log In</button>

        </form>

        <p>
            Don't have an account?
            <a href="./signup.html">Sign up</a>
        </p>
    </main>

    <footer>
        <p>© Michael. All rights reserved.</p>
    </footer>

</body>
</html>
